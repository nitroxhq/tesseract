<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Geist+Mono:wght@100..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href=".assets/white-logo-svg.svg">
    <style>
        :root {
            --serif: 'Instrument Serif', serif;
            --sans-serif: 'Inter', sans-serif;
            --bg-blue: #3232FF;
        }
        body {
            margin: 0;
            padding: 40px 24px;
            background-color: var(--bg-blue);
            color: #ffffff;
            font-family: var(--sans-serif);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 4rem;
            margin: 0 0 1rem 0;
        }
        p {
            font-family: var(--sans-serif);
            font-size: 1rem;
            margin: 0.5rem 0;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.65rem 1.3rem;
            background-color: rgba(255,255,255,0.12);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 160ms ease;
        }
        a:hover {
            background-color: rgba(255,255,255,0.22);
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>page not found</p>
    <p>this feature is coming soon...</p>
    <a href="/">back to home</a>
</body>
</html>
